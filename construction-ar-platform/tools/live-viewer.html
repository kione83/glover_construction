<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Construction AR Live View</title>
  <style>body{margin:0;background:#0b2341;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,1100px);padding:24px;box-sizing:border-box}video{width:100%;background:#000;border-radius:0;max-height:75vh}code{background:#17395d;padding:2px 5px;border-radius:0}#status{color:#d5ecff}#layout{margin-top:16px;padding:12px 16px;background:#17395d;border:1px solid #8dccff;border-radius:0}#layout h2{font-size:18px;margin:0 0 8px}.plan{width:100%;height:auto;background:#0b2341;border:1px solid #8dccff}.legend{display:flex;gap:12px;flex-wrap:wrap;color:#d5ecff;font-size:13px}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{width:10px;height:10px;display:inline-block}</style>
</head>
<body><main><h1>Construction AR · Live phone view</h1><p id="status">Connecting to signaling server…</p><video id="video" autoplay playsinline muted></video><section id="layout"><h2>Live layout</h2><p>No virtual furniture placed yet.</p></section><p>Room: <code id="room"></code></p></main>
<script>
const room=new URLSearchParams(location.search).get('room')||'construction-demo';document.querySelector('#room').textContent=room;
const status=document.querySelector('#status'),video=document.querySelector('#video'),layout=document.querySelector('#layout');const socket=new WebSocket(`ws://${location.host}/signal`);let pc,candidates=[];
socket.onopen=()=>{socket.send(JSON.stringify({type:'join',role:'viewer',room}));status.textContent='Waiting for the iPhone publisher…';};
socket.onmessage=async({data})=>{const message=JSON.parse(data);if(message.type==='offer'){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ontrack=({streams})=>{video.srcObject=streams[0];status.textContent='Receiving live camera feed and layout updates.';};pc.ondatachannel=({channel})=>{if(channel.label==='construction-layout')channel.onmessage=({data})=>{const payload=JSON.parse(data);renderLayout(payload.items||[],payload.roomScan,payload.spatialModel,payload.liveMeasurements,payload.rooms);};};pc.onicecandidate=({candidate})=>candidate&&socket.send(JSON.stringify({type:'candidate',candidate:candidate.toJSON()}));pc.onconnectionstatechange=()=>{status.textContent=`Peer connection: ${pc.connectionState}`;};await pc.setRemoteDescription(message.sdp);for(const candidate of candidates)await pc.addIceCandidate(candidate);candidates=[];const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.send(JSON.stringify({type:'answer',sdp:answer}));}else if(message.type==='candidate'){if(pc?.remoteDescription)await pc.addIceCandidate(message.candidate);else candidates.push(message.candidate);}};
function renderLayout(items,scan,spatialModel,liveMeasurements,rooms){const measurements=liveMeasurements||[];const savedRooms=(rooms||[]).filter(room=>room.roomScan);layout.innerHTML='<h2>Live room model</h2>'+(scan?renderScan(scan):'')+(savedRooms.length?`<p>${savedRooms.length} saved scanned room${savedRooms.length===1?'':'s'} available for project reconstruction.</p>`:'')+(spatialModel?`<p>${Object.keys(spatialModel.roomTransforms||{}).length} room transform${Object.keys(spatialModel.roomTransforms||{}).length===1?'':'s'} · ${(spatialModel.connections||[]).length} spatial connection${(spatialModel.connections||[]).length===1?'':'s'}</p>`:'')+(measurements.length?'<h3>Live estimated measurements</h3>'+measurements.slice(-8).map(item=>`<p><strong>${escapeHtml(item.label)}</strong> · ${Number(item.value).toFixed(2)} ${escapeHtml(item.unit||'m')} · estimated</p>`).join(''):'')+(items.length?'<h3>Planned placements</h3>'+items.map(item=>`<p><strong>${escapeHtml(item.displayName)}</strong> · ${Number(item.dimensions.width).toFixed(2)}m × ${Number(item.dimensions.depth).toFixed(2)}m</p>`).join(''):'<p>No planned placements yet.</p>');}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderScan(scan){const elements=scan.elements||[];const points=elements.map(e=>e.transform?.position).filter(Boolean);if(!points.length)return '<p>Room scan received, but no spatial elements were detected.</p>';const xs=points.map(p=>p.x),zs=points.map(p=>p.z),minX=Math.min(...xs)-1,maxX=Math.max(...xs)+1,minZ=Math.min(...zs)-1,maxZ=Math.max(...zs)+1,scale=Math.min(600/(maxX-minX),340/(maxZ-minZ)),tx=x=>(x-minX)*scale+20,tz=z=>(maxZ-z)*scale+20;const svg=elements.map(e=>drawElement(e,tx,tz,scale)).join('');const objectCount=elements.filter(e=>['furniture','built-in','fixture'].includes(e.kind)).length;return `<p>${elements.filter(e=>e.kind==='wall').length} walls · ${objectCount} recognized contents${scan.ceilingHeight?` · ${Number(scan.ceilingHeight).toFixed(2)}m ceiling`:''}</p><svg class="plan" viewBox="0 0 640 380" role="img" aria-label="Simplified scanned room plan"><rect x="0" y="0" width="640" height="380" fill="#0c0c0c"/>${svg}</svg><div class="legend"><span><i class="swatch" style="background:#f5b82e"></i>walls/openings</span><span><i class="swatch" style="background:#64b5f6"></i>furniture</span><span><i class="swatch" style="background:#9ccc65"></i>built-ins/fixtures</span></div>`;}
function drawElement(e,tx,tz,scale){const p=e.transform.position,d=e.dimensions||{width:.4,height:.4,depth:.4},x=tx(p.x),y=tz(p.z),w=Math.max(6,d.width*scale),h=Math.max(6,d.depth*scale),angle=-(e.transform.rotation?.yaw||0)*180/Math.PI,color=e.kind==='furniture'?'#64b5f6':e.kind==='wall'||e.kind==='door'||e.kind==='window'||e.kind==='opening'?'#f5b82e':'#9ccc65';if(e.kind==='wall'||e.kind==='door'||e.kind==='window'||e.kind==='opening')return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-Math.max(4,d.depth*scale)/2}" width="${w}" height="${Math.max(4,d.depth*scale)}" fill="${color}" opacity=".9"/></g>`;const r=e.representation;if(r==='sofa')return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${Math.min(10,h/3)}" fill="${color}"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${Math.max(4,h*.28)}" fill="#3178ac"/><path d="M ${-w*.18} ${-h*.1}v${h*.35}M ${w*.18} ${-h*.1}v${h*.35}" stroke="#d4efff"/></g>`;if(r==='chair')return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${color}"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${Math.max(4,h*.25)}" fill="#3178ac"/></g>`;if(r==='table')return `<g transform="translate(${x} ${y}) rotate(${angle})"><ellipse cx="0" cy="0" rx="${w/2}" ry="${h/2}" fill="${color}"/><path d="M 0 ${h*.15}v${h*.35}M ${-w*.22} ${h*.15}v${h*.35}M ${w*.22} ${h*.15}v${h*.35}" stroke="#d8f0ff" stroke-width="2"/></g>`;if(r==='bed')return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${color}"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${Math.max(6,h*.25)}" fill="#d4efff"/></g>`;if(r==='cabinet')return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${color}"/><path d="M 0 ${-h/2}V${h/2}M ${-w*.1} 0h${w*.2}" stroke="#e8ffd6" stroke-width="2"/></g>`;if(r==='fireplace')return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${color}"/><rect x="${-w*.25}" y="${-h*.15}" width="${w*.5}" height="${h*.45}" fill="#27313a"/></g>`;return `<g transform="translate(${x} ${y}) rotate(${angle})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${color}"/><path d="M 0 ${-h/2}V${h/2}M ${-w/2} 0H${w/2}" stroke="#e8ffd6"/></g>`;}
renderLayout([],null);socket.onerror=()=>status.textContent='Signaling connection failed.';
</script></body></html>
