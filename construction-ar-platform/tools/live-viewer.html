<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction AR Live View</title><style>body{margin:0;background:#111;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,1100px);padding:24px;box-sizing:border-box}video{width:100%;background:#000;border-radius:12px;max-height:75vh}code {background:#333;padding:2px 5px;border-radius:4px}#status{color:#ccc}</style></head><body><main><h1>Construction AR · Live phone view</h1><p id="status">Connecting to signaling server…</p><video id="video" autoplay playsinline muted></video><p>Room: <code id="room"></code></p></main><script>
const room = new URLSearchParams(location.search).get('room') || 'construction-demo';
document.querySelector('#room').textContent = room;
const status = document.querySelector('#status'), video = document.querySelector('#video');
const socket = new WebSocket(`ws://${location.host}/signal`); let pc, candidates = [];
socket.onopen = () => { socket.send(JSON.stringify({type:'join',role:'viewer',room})); status.textContent = 'Waiting for the iPhone publisher…'; };
socket.onmessage = async ({data}) => { const message = JSON.parse(data); if (message.type === 'offer') { pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}); pc.ontrack = ({streams}) => { video.srcObject = streams[0]; status.textContent = 'Receiving live camera feed.'; }; pc.onicecandidate = ({candidate}) => candidate && socket.send(JSON.stringify({type:'candidate',candidate:candidate.toJSON()})); pc.onconnectionstatechange = () => { status.textContent = `Peer connection: ${pc.connectionState}`; }; await pc.setRemoteDescription(message.sdp); for (const candidate of candidates) await pc.addIceCandidate(candidate); candidates = []; const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); socket.send(JSON.stringify({type:'answer',sdp:answer})); } else if (message.type === 'candidate') { if (pc?.remoteDescription) await pc.addIceCandidate(message.candidate); else candidates.push(message.candidate); } };
socket.onerror = () => status.textContent = 'Signaling connection failed.';
</script></body></html>
